<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Autos</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --text: #f2f2f2;
    --muted: #9aa0aa;
    --accent: #e63946;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
 
  h1 {
    margin-bottom: 8px;
    font-size: 2rem;
    text-align: center;
  }
 
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 40px;
    text-align: center;
  }
 
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }
 
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    width: 400px;
    max-width: 90vw;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
 
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.55);
  }
 
  .card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
  }
 
  .card-content {
    padding: 18px 20px;
  }
 
  .card-content h2 {
    margin: 0 0 6px 0;
    font-size: 1.2rem;
  }
 
  .card-content p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
 
  footer {
    margin-top: 50px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>
 
  <h1>🚗 Galería de Autos</h1>
  <p class="subtitle">Una pequeña muestra de dos autos</p>
 
  <div class="gallery">
 
    <div class="card">
      <img src="auto1.jpg" alt="Auto 1">
      <div class="card-content">
        <h2>Auto 1</h2>
        <p>Descripción breve del primer auto.</p>
      </div>
    </div>
 
    <div class="card">
      <img src="auto2.jpg" alt="Auto 2">
      <div class="card-content">
        <h2>Auto 2</h2>
        <p>Descripción breve del segundo auto.</p>
      </div>
    </div>
 
  </div>
 
  <footer>
    Hecho con HTML y CSS — listo para GitHub Pages
  </footer>
 
</body>
</html>
